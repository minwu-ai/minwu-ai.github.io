name: Saturday History & People draft

# Saturdays draft ONE 'History & People' post: a historical event, episode, or
# figure, plus what it still explains about the present. Saved as a DRAFT
# (published: false) and committed, exactly like the weekday pipeline, so it
# stays hidden on the site until reviewed.
#
# 'Life' posts are written by hand and are never produced by this workflow.

on:
  schedule:
    # GitHub cron is best-effort, so two attempts. The same-day guard keeps the
    # backup slot from producing a second draft.
    - cron: '20 12 * * 6'   # ~08:20 ET Saturday
    - cron: '20 14 * * 6'   # backup ~10:20 ET
  workflow_dispatch:          # run it by hand anytime

permissions:
  contents: write
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York   # keep "today" on the author's calendar, not UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the same-day guard's git log works

      - name: Skip if already drafted today (scheduled runs only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             git log --oneline --grep="History draft $(date +%Y-%m-%d)" | grep -q .; then
            echo "Already drafted today — this backup slot will no-op."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install anthropic

      - name: Draft the History & People post
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py --history

      - name: Commit the new draft
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "Draft Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new draft"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event_name }}" = "schedule" ]; then
              git commit -m "History draft $(date +%Y-%m-%d)"
            else
              git commit -m "Manual history draft $(date +%Y-%m-%d)"
            fi
            pushed=false
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && { pushed=true; break; }
              echo "push attempt $i failed; retrying..."; sleep 5
            done
            if [ "$pushed" = true ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::could not push the draft after retries"; exit 1
            fi
          fi

      - name: Open review issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/open_review_issue.py
