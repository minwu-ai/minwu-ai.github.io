name: Saturday Life briefs

# Saturdays are for the 'Life' section. This workflow deliberately does NOT draft
# a post: a personal essay's value is your own point of view, which the pipeline
# can't supply. Instead it does the legwork — finds a few specific subjects, the
# surprise at the center of each, and verified sources — and opens an Issue so it
# reaches your phone. You write one only if you have something to say.
#
# Nothing is ever committed to the repo by this workflow.

on:
  schedule:
    # GitHub cron is best-effort, so two attempts. The guard below keeps the
    # second one from opening a duplicate issue.
    - cron: '20 12 * * 6'   # ~08:20 ET Saturday
    - cron: '20 14 * * 6'   # backup ~10:20 ET
  workflow_dispatch:          # run it by hand anytime

permissions:
  contents: read
  issues: write

jobs:
  briefs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if briefs already sent today (scheduled runs only)
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             gh issue list --state all --search "Saturday reading — $(date -u +%Y-%m-%d) in:title" \
               --json number --jq 'length' | grep -qv '^0$'; then
            echo "Briefs already sent today — this backup slot will no-op."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install anthropic

      - name: Generate Life briefs
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py --life-briefs --out life_briefs.md

      - name: Send briefs as an issue
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIEF_FILE: life_briefs.md
        run: python .github/scripts/open_life_brief_issue.py
