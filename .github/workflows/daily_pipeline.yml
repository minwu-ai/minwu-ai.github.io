name: Daily draft pipeline

# Runs the pipeline on a schedule to draft new articles.
# New posts are saved as DRAFTS (published: false) and committed to the repo.
# They stay hidden on the site until you review and approve them.

on:
  schedule:
    # GitHub cron is best-effort and often drops a slot, so we try several off-peak
    # times each day. A same-day guard (below) ensures only the FIRST one that
    # actually fires produces drafts — the rest no-op, so no duplicate posts.
    # Mon-Fri only. Saturday 'Life' mode exists in pipeline.py (run it by hand with
    # `python pipeline.py --life`) but is NOT scheduled — change 1-5 to 1-6 to enable.
    - cron: '7 6 * * 1-5'    # ~02:07 ET — early so GitHub's delays still land by morning
    - cron: '43 7 * * 1-5'   # backup ~03:43 ET
    - cron: '23 9 * * 1-5'   # backup ~05:23 ET
  workflow_dispatch:           # also lets you run it manually anytime
    inputs:
      count:
        description: "How many posts to draft (blank = weekday default: 2, or 1 on Tue/Thu)"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    # Runners default to UTC, which put post dates and the same-day guard on a
    # different calendar day than the author's. Pin everything to Eastern so
    # "today" means the same thing here, in the commit message, and in the
    # frontmatter date Python writes.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the same-day guard's git log works

      - name: Skip if already drafted today (scheduled runs only)
        id: guard
        run: |
          # Only a previous SCHEDULED run counts. Manual runs commit under a
          # different prefix so they never consume the day's scheduled slot.
          if [ "${{ github.event_name }}" = "schedule" ] && \
             git log --oneline --grep="Daily drafts $(date +%Y-%m-%d)" | grep -q .; then
            echo "Already drafted today — this backup slot will no-op."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install anthropic

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ github.event.inputs.count }}
        # Pass --count only for a manual run. Scheduled runs let pipeline.py
        # pick by weekday: two drafts Mon/Wed/Fri, one on Tue/Thu.
        run: |
          if [ -n "$COUNT" ]; then
            python pipeline.py --count "$COUNT"
          else
            python pipeline.py
          fi

      - name: Commit new drafts
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "Draft Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new drafts"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event_name }}" = "schedule" ]; then
              git commit -m "Daily drafts $(date +%Y-%m-%d)"
            else
              git commit -m "Manual drafts $(date +%Y-%m-%d)"
            fi
            # Resilient push: rebase onto any concurrent changes, retry a few times.
            pushed=false
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && { pushed=true; break; }
              echo "push attempt $i failed; retrying..."; sleep 5
            done
            if [ "$pushed" = true ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::could not push drafts after retries"; exit 1
            fi
          fi

      - name: Open review issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/open_review_issue.py

      - name: Notify when no drafts were produced
        if: steps.commit.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_EMPTY: "1"
        run: python .github/scripts/open_review_issue.py
